name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x" # trusted publishing requires Node >= 22.14.0
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      # Trusted publishing requires npm CLI >= 11.5.1; don't rely on whatever
      # ships bundled with the Node version above.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Uses OIDC trusted publishing (configured on npmjs.com for this repo/workflow) -
      # no NPM_TOKEN needed. Provenance attestations are generated automatically.
      - name: Publish to npm
        run: npm publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ./docs/RELEASE_${{ github.ref_name }}.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
